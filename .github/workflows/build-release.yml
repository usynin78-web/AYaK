name: Build and Publish AYaK Release

on:
  # Каждый новый тег версии автоматически запускает сборку и публикацию релиза.
  push:
    tags:
      - 'v*'

  # Ручной запуск для уже существующего тега.
  workflow_dispatch:
    inputs:
      tag:
        description: "Точный тег версии, например v0.1.3.dev"
        required: true
        type: string
      build_only:
        description: "Только собрать архивы, не публикуя релиз."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ayak-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x86_64
            preset: Windows Desktop
            output: build/AYaK-windows-x86_64.exe
            package: AYaK-windows-x86_64.zip
            kind: windows
          - platform: Linux x86_64
            preset: Linux
            output: build/AYaK-linux-x86_64
            package: AYaK-linux-x86_64.tar.gz
            kind: linux

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Godot 4.7 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Prepare build directory
        run: mkdir -p build dist

      - name: Export game
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          OUTPUT: ${{ matrix.output }}
        run: |
          godot --headless --path . --export-release "$PRESET" "$OUTPUT"

          # Проверяем, что исполняемый файл и отдельный PCK действительно созданы.
          test -s "$OUTPUT"
          test -s "${OUTPUT%.*}.pck"

      - name: Package Windows build
        if: matrix.kind == 'windows'
        env:
          OUTPUT: ${{ matrix.output }}
          PACKAGE: ${{ matrix.package }}
        run: |
          zip -j "dist/$PACKAGE" "$OUTPUT" "${OUTPUT%.*}.pck"
          test -s "dist/$PACKAGE"

      - name: Package Linux build
        if: matrix.kind == 'linux'
        env:
          OUTPUT: ${{ matrix.output }}
          PACKAGE: ${{ matrix.package }}
        run: |
          chmod +x "$OUTPUT"
          tar -czf "dist/$PACKAGE" -C build "$(basename "$OUTPUT")" "$(basename "${OUTPUT%.*}.pck")"
          test -s "dist/$PACKAGE"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kind }}-build
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: inputs.build_only != true
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Windows and Linux builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes from commits and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # GitHub собирает описание изменений с момента предыдущего релиза.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body' > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::GitHub не вернул описание изменений."
            exit 1
          fi

          echo "Generated release notes:"
          cat release-notes.md

      - name: Check build files
        run: |
          ls -lh dist
          test -s dist/AYaK-windows-x86_64.zip
          test -s dist/AYaK-linux-x86_64.tar.gz

      - name: Create or update and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          # Версии с .dev автоматически помечаются как предварительные релизы.
          RELEASE_FLAGS=()
          if [[ "$TAG" == *".dev"* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Повторный запуск обновляет файлы и описание существующего релиза.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --title "AYaK $TAG" \
              --notes-file release-notes.md \
              "${RELEASE_FLAGS[@]}"
          else
            # Новый релиз сразу публикуется, а не остаётся черновиком.
            gh release create "$TAG" dist/* \
              --title "AYaK $TAG" \
              --notes-file release-notes.md \
              "${RELEASE_FLAGS[@]}"
          fi
