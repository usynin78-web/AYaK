name: Godot GDScript checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Если ты отправишь несколько коммитов подряд, старые проверки отменятся.
concurrency:
  group: godot-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Godot project (GDScript)
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7 (standard, without Mono)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import project and check scripts
        id: godot_check
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit > godot-check.log 2>&1
          GODOT_EXIT_CODE=$?
          set -e

          # Из лога берём только настоящие ошибки парсера/скриптов,
          # а не обычные предупреждения движка.
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          log = Path("godot-check.log").read_text(errors="replace").splitlines()
          errors = []
          seen = set()

          for line in log:
              if "SCRIPT ERROR:" in line or re.search(r"(^|\s)ERROR:", line):
                  clean = line.strip()
                  if clean and clean not in seen:
                      seen.add(clean)
                      errors.append(clean)

          Path("godot-errors.json").write_text(
              json.dumps(errors, ensure_ascii=False, indent=2)
          )
          print(f"Найдено ошибок: {len(errors)}")
          PY

          ERROR_COUNT=$(python3 -c "import json; print(len(json.load(open('godot-errors.json'))))")
          echo "error_count=$ERROR_COUNT" >> "$GITHUB_OUTPUT"
          echo "godot_exit_code=$GODOT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$ERROR_COUNT" -gt 0 ]; then
            exit 1
          fi

          if [ "$GODOT_EXIT_CODE" -ne 0 ]; then
            echo "::warning::Godot завершился с кодом $GODOT_EXIT_CODE. См. godot-check.log."
          fi

      - name: Create or update GitHub Issues for errors
        if: always() && steps.godot_check.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ERROR_FILE: godot-errors.json
        with:
          script: |
            const fs = require('fs');
            const errors = fs.existsSync(process.env.ERROR_FILE)
              ? JSON.parse(fs.readFileSync(process.env.ERROR_FILE, 'utf8'))
              : [];

            if (errors.length === 0) {
              core.info('Ошибки GDScript не обнаружены. Новые Issues не создаются.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = 'automated';
            const bugLabel = 'bug';
            
            for (const label of [labelName, bugLabel]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label,
                  color: label === bugLabel ? 'd73a4a' : '7057ff',
                  description: label === bugLabel ? 'Ошибка проекта' : 'Создано автоматической проверкой Godot'
                });
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: labelName, per_page: 100
            });

            for (const error of errors) {
              const fingerprint = Buffer.from(error).toString('base64').slice(0, 80);
              const marker = '<!-- godot-error:' + fingerprint + ' -->';
              const titleText = error.replace(/\s+/g, ' ').slice(0, 150);
              const title = '[Godot] ' + titleText;

              const duplicate = existing.find(issue =>
                !issue.pull_request && issue.body && issue.body.includes(marker)
              );

              const runUrl = 'https://github.com/' + owner + '/' + repo +
                '/actions/runs/' + context.runId;
              const body = [
                'Эта Issue создана автоматической проверкой Godot.',
                '',
                '**Сообщение ошибки:**',
                '```text',
                error,
                '```',
                '',
                '**Коммит:** `' + context.sha + '`',
                '**Запуск проверки:** ' + runUrl,
                '',
                'Проверь ошибку вручную. Автоматическая проверка не исправляет код.',
                '',
                marker
              ].join('\n');

              if (duplicate) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: duplicate.number,
                  body: 'Ошибка повторно обнаружена в коммите `' +
                    context.sha + '`.\n\n' + runUrl
                });
                core.info('Повтор ошибки: Issue #' + duplicate.number);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: [bugLabel, labelName]
                });
                core.info('Создана Issue #' + created.data.number);
              }
            }

      - name: Save Godot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-check-log
          path: |
            godot-check.log
            godot-errors.json
          if-no-files-found: ignore
